# ════════════════════════════════════════════════════════════════════════
#  CI — two jobs, deliberately.
#
#  WHY TWO. The first version put everything in one job, with the SITE
#  checkout as step 2. When `SITE_REPO_TOKEN` was missing the run died there
#  and typecheck, tests and build were SKIPPED — reported as "skipped", which
#  reads as "not run" but lands as a red run with no information in it. A
#  missing credential must not be able to hide whether the code compiles.
#
#    verify         — everything that needs only this repo. Always runs.
#    pricing-parity — the cross-repository gate. Needs the SITE checkout, and
#                     FAILS LOUDLY (never skips) when it cannot be verified.
#
#  Both must be green to merge. The split changes WHAT YOU LEARN from a red
#  run, not what is required.
#
#  ── CREDENTIAL REQUIRED ────────────────────────────────────────────────
#  WMIWCI-SITE is PRIVATE and WMIWCI-API is PUBLIC, so the default
#  GITHUB_TOKEN cannot read it. Add a repository secret:
#
#      SITE_REPO_TOKEN — a fine-grained PAT, READ-ONLY:
#        Repository access : only vasquezdiego335-coder/WMIWCI-SITE
#        Permissions       : Contents = Read   (nothing else)
#
#      gh secret set SITE_REPO_TOKEN --repo vasquezdiego335-coder/WMIWCI-API
#
#  Without it `pricing-parity` fails with a named error rather than skipping —
#  an unverifiable release must never look like a passing one. This repo is
#  public, so workflow logs are public: the token is never echoed, and only
#  branch names appear in output.
# ════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      site_ref:
        description: 'WMIWCI-SITE ref to verify against (defaults to the matching branch name, then PRODUCTION_SITE_BRANCH — NOT master)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma only needs a syntactically valid URL to validate + generate. No
  # database is contacted anywhere in this workflow.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  # `next build` collects page data, which imports src/lib/auth.ts, which
  # refuses to load without a JWT secret in production. A THROWAWAY value: it
  # signs nothing, verifies nothing and never leaves the runner — but without
  # it the build fails on every run, which is how a "green" CI that never
  # actually built anything would look.
  JWT_SECRET: ci-build-only-not-a-real-secret-0000000000000000000000000000
  # NODE_ENV is deliberately NOT set here. As a job-level variable it makes
  # `npm ci` omit devDependencies, so typescript, tsx and jsdom are absent and
  # every gate that needs them either dies or — worse — `npx` silently fetches
  # an unrelated package of the same name from the registry. `npx tsc` did
  # exactly that on run 32641446234: it installed tsc@2.0.4, which is not the
  # TypeScript compiler. NODE_ENV=production is set on the BUILD step alone,
  # where it belongs.

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  1 · VERIFY — needs nothing but this repo, so it always reports.
  # ══════════════════════════════════════════════════════════════════════
  verify:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate + generate
        run: |
          npx prisma validate
          npx prisma generate

      # ── MIGRATIONS ARE CHECKED, NOT APPLIED ─────────────────────────────
      #  No database is reachable here by design. What CI can prove is that
      #  every migration is present and consistently named; applying them is a
      #  deploy step with its own review.
      - name: Migration files are readable and named consistently
        run: |
          set -euo pipefail
          for d in prisma/migrations/*/; do
            [ "$d" = "prisma/migrations/*/" ] && continue
            test -f "$d/migration.sql" || { echo "::error::$d has no migration.sql"; exit 1; }
            base=$(basename "$d")
            echo "$base" | grep -Eq '^[0-9]{14}_[a-z0-9_]+$' \
              || { echo "::error::migration $base does not match <14-digit timestamp>_<snake_case>"; exit 1; }
          done

      - name: Typecheck
        # `npm run typecheck`, never `npx tsc`: the script resolves the
        # typescript binary this repo pins. npx would download whatever is
        # published as "tsc" when the local one is missing.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # WMIWCI_SITE_DIR is deliberately UNSET here: the cross-repository tests
      # skip cleanly without it, and `pricing-parity` below is the job that
      # actually runs them. This step proves the server-side suite compiles and
      # passes on its own.
      - name: Test suite (server-side; cross-repo tests run in pricing-parity)
        run: npm test

      - name: Production build
        # The production path is what we want to prove builds — auth.ts refuses
        # to load without a JWT secret when NODE_ENV is production, and that
        # check must actually run.
        env:
          NODE_ENV: production
        run: npm run build

      # ── WHAT THIS SCAN DOES AND DOES NOT COVER ─────────────────────────
      #  A NAMED-ROUTE check, not a proof. Three exclusions, each a real gap:
      #   • `(admin)/**` — admin screens legitimately render historical labels;
      #     an owner looking at a 2026-07 booking must see "Small Studio".
      #   • shared `chunks/**` — contains the price book itself, which
      #     necessarily holds every retired label so history can render. So
      #     this CANNOT prove a customer route is label-free via a shared chunk.
      #   • `.next/cache/**` — build cache, not shipped.
      #  The actual guarantee that a customer cannot be quoted a retired price
      #  is the server refusal plus the browser allowlist, both covered by tests.
      - name: No retired package label in a customer-facing route bundle
        run: |
          set -euo pipefail
          ROUTES="app/deposit app/my-booking app/api/leads app/api/services app/api/bookings app/terms app/privacy"
          hits=""
          for r in $ROUTES; do
            [ -d ".next/server/$r" ] || continue
            found=$(grep -rl "Small Studio\|Standard Studio\|Large Studio" ".next/server/$r" 2>/dev/null || true)
            [ -n "$found" ] && hits="$hits$found"$'\n'
          done
          pub=$(grep -rl "Small Studio\|Standard Studio\|Large Studio" .next/static/chunks 2>/dev/null \
                | grep -v "admin" || true)
          [ -n "$pub" ] && hits="$hits$pub"$'\n'
          if [ -n "${hits// /}" ]; then
            echo "::error::a retired package label reached a customer-facing bundle:"
            echo "$hits"
            exit 1
          fi
          echo "Checked routes: $ROUTES + non-admin static chunks."
          echo "NOT checked (by design, see the comment above): (admin)/**, shared server chunks/**, .next/cache/**."

  # ══════════════════════════════════════════════════════════════════════
  #  2 · PRICING PARITY — the cross-repository gate.
  #     Fails, never skips, when the mirror cannot be verified.
  # ══════════════════════════════════════════════════════════════════════
  pricing-parity:
    name: cross-repository pricing parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out WMIWCI-API
        uses: actions/checkout@v4
        with:
          path: api

      # ── THE MATCHING SITE BRANCH ────────────────────────────────────────
      #  Resolution order, most specific first:
      #    1. the workflow_dispatch input, when given
      #    2. a SITE branch with the SAME NAME as this one — so a paired change
      #       (price book here, regenerated mirror there) is verified together
      #    3. PRODUCTION_SITE_BRANCH below
      #
      #  ⚠ THE FALLBACK IS THE DEPLOYED BRANCH, NOT `master`.
      #  Established by byte comparison against production on 2026-08-22: the
      #  live quote.html and pricing-config.js match
      #  claude/quick-quote-email-flow, and `master` contains neither file.
      #  Falling back to master would verify a tree nobody ships and report
      #  success — the same class of false green as skipping. If the deployed
      #  branch changes in Vercel, change it HERE in the same breath.
      - name: Resolve the SITE ref
        id: siteref
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          PRODUCTION_SITE_BRANCH: claude/quick-quote-email-flow
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SITE_REPO_TOKEN is not set (or is not readable from this event). WMIWCI-SITE is private, so pricing parity cannot be verified. Add a fine-grained, READ-ONLY PAT (Contents: Read on WMIWCI-SITE) as the repository secret SITE_REPO_TOKEN. Refusing to pass a run that proves nothing. NOTE: the 'verify' job runs independently, so typecheck, tests and build results are still available on this run."
            exit 1
          fi
          OWNER="${{ github.repository_owner }}"
          REPO="$OWNER/WMIWCI-SITE"

          # ── PROVE THE TOKEN CAN SEE THE REPOSITORY, BEFORE BLAMING A BRANCH
          #  This used to probe branches with `git ls-remote` over a
          #  `https://x-access-token:$TOKEN@` URL, and on any failure reported
          #  "WMIWCI-SITE has no branch X". A missing branch is only one cause.
          #  A token without access to the repository produces the identical
          #  message, and so does an auth form the credential does not accept —
          #  three different problems behind one misleading sentence, and the
          #  first reading sends you hunting for a branch that is sitting there.
          #
          #  `gh api` uses GH_TOKEN natively and separates them.
          if ! gh api "repos/$REPO" --jq .full_name > repo.txt 2> repo.err; then
            echo "::error::SITE_REPO_TOKEN cannot read $REPO. This is a CREDENTIAL SCOPE problem, not a missing branch. The token needs repository access to the private $REPO with permission Contents: Read."
            echo "gh reported:"
            cat repo.err
            exit 1
          fi
          echo "Token can read: $(cat repo.txt)"

          BRANCH="${{ github.head_ref || github.ref_name }}"
          WANTED="${{ inputs.site_ref }}"
          HOW="workflow_dispatch input"
          branch_exists() { gh api "repos/$REPO/branches/$1" --jq .name > /dev/null 2>&1; }

          if [ -z "$WANTED" ]; then
            if branch_exists "$BRANCH"; then
              WANTED="$BRANCH"; HOW="matching branch name"
            else
              WANTED="$PRODUCTION_SITE_BRANCH"; HOW="production fallback"
            fi
          fi
          if ! branch_exists "$WANTED"; then
            echo "::error::WMIWCI-SITE has no branch '$WANTED' ($HOW). The token CAN read the repository, so this is genuinely a missing branch."
            echo "Branches the token can see:"
            gh api "repos/$REPO/branches" --paginate --jq '.[].name' || true
            exit 1
          fi
          echo "ref=$WANTED" >> "$GITHUB_OUTPUT"
          echo "Verifying pricing parity against WMIWCI-SITE@$WANTED ($HOW)"

      - name: Check out WMIWCI-SITE
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/WMIWCI-SITE
          ref: ${{ steps.siteref.outputs.ref }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      # ── THE PAIRED COMMITS, PRINTED ────────────────────────────────────
      #  A cross-repository result means nothing without knowing WHICH two
      #  trees produced it. Both SHAs go in the log and in the job summary so a
      #  release report can quote them instead of assuming them.
      - name: Print the paired API and SITE checkout SHAs
        run: |
          set -euo pipefail
          API_SHA="$(git -C api rev-parse HEAD)"
          SITE_SHA="$(git -C site rev-parse HEAD)"
          SITE_REF="${{ steps.siteref.outputs.ref }}"
          echo "API  checkout: $API_SHA"
          echo "SITE checkout: $SITE_SHA  (ref: $SITE_REF)"
          {
            echo "### Cross-repository pricing parity"
            echo ""
            echo "| Repo | Ref | SHA |"
            echo "|---|---|---|"
            echo "| WMIWCI-API | ${{ github.ref_name }} | \`$API_SHA\` |"
            echo "| WMIWCI-SITE | $SITE_REF | \`$SITE_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A checkout that "succeeded" but produced no mirror would let the tests
      # fall back to skipping. Prove the files are there before trusting the run.
      - name: Confirm the SITE files are present
        run: |
          set -euo pipefail
          for f in public/js/pricing-config.js public/quote.html public/booking-form.html; do
            test -f "site/$f" \
              || { echo "::error::WMIWCI-SITE@${{ steps.siteref.outputs.ref }} has no $f — the cross-repository tests cannot run."; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Prisma generate
        working-directory: api
        run: npx prisma generate

      # THE GATE. WMIWCI_SITE_DIR is absolute and points at the checkout above;
      # the tests THROW if it is set and wrong, so this cannot pass by skipping.
      - name: Pricing parity, route, browser and persistence tests
        working-directory: api
        env:
          WMIWCI_SITE_DIR: ${{ github.workspace }}/site
        run: |
          set -euo pipefail
          npm run test:parity 2>&1 | tee ../parity.log
          # ZERO SKIPPED, ZERO TODO. A cross-repository job whose suites skip
          # is the exact failure this gate exists to prevent: three suites were
          # absent from the command AND resolved a sibling path, so every one
          # of their assertions skipped while the run reported success.
          skipped="$(grep -Eo '^# skipped [0-9]+' ../parity.log | awk '{print $3}' | tail -1)"
          todo="$(grep -Eo '^# todo [0-9]+' ../parity.log | awk '{print $3}' | tail -1)"
          echo "skipped=${skipped:-?} todo=${todo:-?}"
          if [ "${skipped:-1}" != "0" ] || [ "${todo:-1}" != "0" ]; then
            echo "::error::cross-repository suite reported skipped=${skipped:-?} todo=${todo:-?}; it must be 0/0."
            exit 1
          fi

      # The mirror is GENERATED. If the committed copy differs from what the
      # generator produces, it was hand-edited or is stale.
      - name: The committed mirror is exactly what the generator produces
        working-directory: api
        run: |
          set -euo pipefail
          npx tsx scripts/gen-pricing-config.ts /tmp/mirror-regen.js
          cmp /tmp/mirror-regen.js "${{ github.workspace }}/site/public/js/pricing-config.js" \
            || { echo "::error::the committed pricing mirror is not the generator's output — run: npm run gen:pricing-config"; exit 1; }
          echo "Mirror is byte-identical to the generator output."
